name: aegis-spend-guard
version: 1.1.0
description: "Owner-set spend policy for agent tool calls: per-transaction cap, daily limit, recipient allow/blocklists and a freeze switch, enforced in pre_tool_call before any spend executes — including spends written into shell commands and scripts the agent runs. Over-policy spends are blocked; borderline ones are routed to the owner through Hermes's approval gate."
author: "George Agbe (@georgebuilding2)"
provides_tools:
  - spend_guard_check
  - spend_guard_status
provides_hooks:
  - pre_tool_call
  - post_tool_call
config_schema:
  per_tx_cap_usd:
    type: float
    default: 25.0
    description: "Maximum amount for a single agent spend, in USD."
  daily_limit_usd:
    type: float
    default: 100.0
    description: "Maximum total agent spend per day (UTC), in USD."
  warn_bps:
    type: int
    default: 8000
    description: "Warn-zone threshold in basis points of a limit (8000 = 80%): spends at or above it are routed to the owner for approval."
  frozen:
    type: bool
    default: false
    description: "Kill switch: when true, every spend is blocked."
  allowlist:
    type: list
    default: []
    description: "Known-good recipients. When non-empty, recipients not on the list are routed to the owner (or blocked, per unknown_recipient)."
  blocklist:
    type: list
    default: []
    description: "Known-bad recipients. Spends to these are always blocked."
  allowed_tools:
    type: list
    default: []
    description: "Spend-tool scope. When non-empty, spends from tools not on the list are routed to the owner."
  paid_tools:
    type: dict
    default: {}
    description: "Fixed per-call prices in USD for tools that charge per call, e.g. {some_paid_tool: 0.50}. Calls to these tools are treated as spends at that price."
  gate_scripts:
    type: bool
    default: true
    description: "Inspect command/script text (command/cmd/script/code arguments, e.g. terminal calls) for spends: money literals are priced and checked against policy; a payment verb with no readable amount is routed to the owner. Turn off only if the agent's shell use must never be gated."
  unknown_recipient:
    type: str
    default: "warn"
    description: "What to do with a recipient not on a non-empty allowlist: 'warn' routes to the owner for approval; 'block' refuses outright."
